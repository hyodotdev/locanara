name: Release Android SDK

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Publish the version already committed on main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release inputs
        run: |
          bun run version:check
          VERSION=$(jq -er '.android' locanara-versions.json)
          TAG_NAME="android-$VERSION"
          POM_URL="https://repo1.maven.org/maven2/com/locanara/locanara/$VERSION/locanara-$VERSION.pom"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$POM_URL")
          case "$STATUS" in
            404) ;;
            200)
              echo "Maven Central already contains com.locanara:locanara:$VERSION"
              exit 1
              ;;
            *)
              echo "Could not verify Maven Central state (HTTP $STATUS)"
              exit 1
              ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        working-directory: packages/android
        run: ./gradlew :locanara:test :locanara:build :example:assembleDebug

      - name: Publish to Maven Central
        working-directory: packages/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :locanara:publishAllPublicationsToMavenCentralRepository \
            -Psdk.version="$VERSION"

      - name: Create immutable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Android SDK $VERSION"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Android SDK $VERSION" \
            --notes "Locanara Android SDK v$VERSION

          ## Installation
          \`\`\`kotlin
          implementation(\"com.locanara:locanara:$VERSION\")
          \`\`\`

          Package minimum: Android API 31. Gemini Nano Prompt API availability is checked at runtime."

      - name: Summary
        run: |
          echo "## Android SDK Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
