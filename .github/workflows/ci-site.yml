name: CI Site

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "locanara-versions.json"
      - "bun.lock"
      - ".github/workflows/ci-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/site/**"
      - "locanara-versions.json"
      - "bun.lock"
      - ".github/workflows/ci-site.yml"

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate version synchronization
        run: bun run version:check

      - name: Type check
        working-directory: packages/site
        run: bun run typecheck

      - name: Lint
        working-directory: packages/site
        run: bun run lint

      - name: Format check
        working-directory: packages/site
        run: bun run format:check

      - name: Test
        working-directory: packages/site
        run: bun run test

      - name: Build
        working-directory: packages/site
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
