name: Release Types

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Release the generated types version already committed on main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-types
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release inputs
        run: |
          bun run version:check
          VERSION=$(jq -er '.types' locanara-versions.json)
          TAG_NAME="types-$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Generate types
        working-directory: packages/gql
        run: bun run generate

      - name: Verify tracked generated outputs
        run: |
          git diff --exit-code -- \
            packages/apple/Sources/Types.swift \
            packages/android/locanara/src/main/kotlin/com/locanara/Types.kt

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          zip -j artifacts/locanara-typescript.zip packages/gql/src/generated/types.ts
          zip -j artifacts/locanara-kotlin.zip packages/gql/src/generated/Types.kt
          zip -j artifacts/locanara-swift.zip packages/gql/src/generated/Types.swift
          zip -j artifacts/locanara-dart.zip packages/gql/src/generated/types.dart

      - name: Create immutable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" artifacts/*.zip \
            --title "$TAG_NAME" \
            --generate-notes \
            --notes "Generated TypeScript, Kotlin, Swift, and Dart Locanara types."

      - name: Summary
        run: |
          echo "## Types Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
