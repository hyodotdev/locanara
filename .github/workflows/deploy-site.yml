name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "packages/site/**"
      - "locanara-versions.json"
      - "package.json"
      - "bun.lock"
      - "scripts/sync-versions.mjs"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate version synchronization
        run: bun run version:check

      - name: Verify site
        working-directory: packages/site
        run: |
          bun run typecheck
          bun run lint
          bun run format:check
          bun run test
          bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Deploy production site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCANARA }}
          projectId: locanara
          channelId: live
          entryPoint: packages/site

      - name: Summary
        run: |
          echo "## Site Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://locanara.com" >> "$GITHUB_STEP_SUMMARY"
