name: Release Apple SDK

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Publish the version already committed on main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-apple
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: macos-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Validate release inputs
        run: |
          bun run version:check
          VERSION=$(jq -er '.apple' locanara-versions.json)
          TAG_NAME="$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          if pod trunk info Locanara 2>/dev/null | grep -Fq -- "- $VERSION "; then
            echo "CocoaPods already contains Locanara $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Verify Apple SDK
        working-directory: packages/apple
        run: swift build -c release && swift test -c release

      - name: Verify Apple example
        working-directory: packages/apple/Example
        run: |
          xcodebuild \
            -scheme LocanaraExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate checked-in podspec
        run: pod lib lint packages/apple/Locanara.podspec --allow-warnings

      - name: Create immutable SPM tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Apple SDK $VERSION"
          git push origin "$TAG_NAME"

      - name: Publish checked-in podspec
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push packages/apple/Locanara.podspec --allow-warnings

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Apple SDK $VERSION" \
            --notes "Locanara Apple SDK v$VERSION

          Package minimums: iOS 17 and macOS 14. Foundation Models availability is checked at runtime on supported OS versions."

      - name: Summary
        run: |
          echo "## Apple SDK Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
