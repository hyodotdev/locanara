name: CI GQL

on:
  push:
    branches: [main]
    paths:
      - "packages/gql/**"
      - "packages/apple/Sources/Types.swift"
      - "packages/android/locanara/src/main/kotlin/com/locanara/Types.kt"
      - "bun.lock"
      - ".github/workflows/ci-gql.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/gql/**"
      - "packages/apple/Sources/Types.swift"
      - "packages/android/locanara/src/main/kotlin/com/locanara/Types.kt"
      - "bun.lock"
      - ".github/workflows/ci-gql.yml"

jobs:
  build:
    name: Generate & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test generator
        working-directory: packages/gql
        run: bun test

      - name: Generate types
        working-directory: packages/gql
        run: bun run generate

      - name: Verify tracked generated outputs
        run: |
          git diff --exit-code -- \
            packages/apple/Sources/Types.swift \
            packages/android/locanara/src/main/kotlin/com/locanara/Types.kt
