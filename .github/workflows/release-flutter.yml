name: Release flutter_ondevice_ai

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release after pub.dev publication
        required: true
        default: true
        type: boolean
      confirm_release:
        description: "Publish the version already committed on main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-flutter-ondevice-ai
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release inputs
        run: |
          bun run version:check
          VERSION=$(jq -er '.flutter' locanara-versions.json)
          TAG_NAME="flutter-$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          PACKAGE_JSON=$(mktemp)
          trap 'rm -f "$PACKAGE_JSON"' EXIT
          curl --fail --silent --show-error \
            --output "$PACKAGE_JSON" \
            https://pub.dev/api/packages/flutter_ondevice_ai

          if jq -e --arg version "$VERSION" \
            'any(.versions[]; .version == $version)' "$PACKAGE_JSON" >/dev/null; then
            echo "pub.dev already contains flutter_ondevice_ai $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: libraries/flutter_ondevice_ai
        run: flutter pub get

      - name: Verify package
        working-directory: libraries/flutter_ondevice_ai
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          dart pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: libraries/flutter_ondevice_ai
        run: dart pub publish --force

      - name: Create immutable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "flutter_ondevice_ai $VERSION"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "flutter_ondevice_ai $VERSION" \
            --notes "Install with: flutter_ondevice_ai: ^$VERSION"

      - name: Summary
        run: |
          echo "## flutter_ondevice_ai Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
