name: CI Version Mirrors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "locanara-versions.json"
      - "packages/site/locanara-versions.json"
      - "package.json"
      - "packages/gql/package.json"
      - "packages/web/package.json"
      - "packages/android/package.json"
      - "libraries/expo-ondevice-ai/package.json"
      - "libraries/expo-ondevice-ai/android/build.gradle"
      - "libraries/react-native-ondevice-ai/package.json"
      - "libraries/react-native-ondevice-ai/android/build.gradle"
      - "libraries/flutter_ondevice_ai/pubspec.yaml"
      - "libraries/flutter_ondevice_ai/android/build.gradle"
      - "libraries/flutter_ondevice_ai/ios/flutter_ondevice_ai.podspec"
      - "scripts/sync-versions.mjs"
      - ".github/workflows/ci-version-mirrors.yml"
  pull_request:
    branches: [main]
    paths:
      - "locanara-versions.json"
      - "packages/site/locanara-versions.json"
      - "package.json"
      - "packages/gql/package.json"
      - "packages/web/package.json"
      - "packages/android/package.json"
      - "libraries/expo-ondevice-ai/package.json"
      - "libraries/expo-ondevice-ai/android/build.gradle"
      - "libraries/react-native-ondevice-ai/package.json"
      - "libraries/react-native-ondevice-ai/android/build.gradle"
      - "libraries/flutter_ondevice_ai/pubspec.yaml"
      - "libraries/flutter_ondevice_ai/android/build.gradle"
      - "libraries/flutter_ondevice_ai/ios/flutter_ondevice_ai.podspec"
      - "scripts/sync-versions.mjs"
      - ".github/workflows/ci-version-mirrors.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify synchronized version consumers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify all version consumers
        run: bun run version:check
