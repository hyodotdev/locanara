name: CI Version Mirrors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "locanara-versions.json"
      - "packages/site/locanara-versions.json"
  pull_request:
    branches: [main]
    paths:
      - "locanara-versions.json"
      - "packages/site/locanara-versions.json"

permissions:
  contents: read

jobs:
  verify:
    name: Verify synchronized version maps
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install compiler dependencies
        working-directory: scripts/agent
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify version mirrors
        working-directory: scripts/agent
        run: bun run check:versions
