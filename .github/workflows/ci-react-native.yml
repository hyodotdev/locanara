name: CI React Native

on:
  push:
    branches: [main]
    paths:
      - "libraries/react-native-ondevice-ai/**"
      - "!libraries/react-native-ondevice-ai/**/*.md"
      - "!libraries/react-native-ondevice-ai/**/*.mdx"
      - "!libraries/react-native-ondevice-ai/example/src/screens/SettingsScreen.tsx"
      - ".github/workflows/ci-react-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "libraries/react-native-ondevice-ai/**"
      - "!libraries/react-native-ondevice-ai/**/*.md"
      - "!libraries/react-native-ondevice-ai/**/*.mdx"
      - "!libraries/react-native-ondevice-ai/example/src/screens/SettingsScreen.tsx"
      - ".github/workflows/ci-react-native.yml"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.filter.outputs.library }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            library:
              - '.github/workflows/ci-react-native.yml'
              - 'libraries/react-native-ondevice-ai/**'
              - '!libraries/react-native-ondevice-ai/**/*.md'
              - '!libraries/react-native-ondevice-ai/**/*.mdx'
              - '!libraries/react-native-ondevice-ai/example/src/screens/SettingsScreen.tsx'

  lint-and-test:
    name: Lint & Test
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/react-native-ondevice-ai

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-rn-${{ hashFiles('libraries/react-native-ondevice-ai/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-rn-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint:ci

      - name: Test
        run: bun run test

      - name: Build
        run: npx --no-install bob build

      - name: Verify nitrogen drift
        run: |
          bun run nitrogen
          git diff --exit-code -- nitrogen/generated

      - name: Verify build output
        run: |
          if [ ! -f "lib/module/index.js" ] || [ ! -f "lib/typescript/src/index.d.ts" ]; then
            echo "Build output missing!"
            exit 1
          fi

  build-android:
    name: Build Android
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install library dependencies
        working-directory: libraries/react-native-ondevice-ai
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build library
        working-directory: libraries/react-native-ondevice-ai
        run: npx --no-install bob build

      - name: Register local library
        working-directory: libraries/react-native-ondevice-ai
        run: bun link

      - name: Install example dependencies
        working-directory: libraries/react-native-ondevice-ai/example
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Replace circular library link
        working-directory: libraries/react-native-ondevice-ai/example
        run: |
          unlink node_modules/react-native-ondevice-ai
          rsync -a --exclude='example' --exclude='node_modules' ../ node_modules/react-native-ondevice-ai/

      - name: Test example
        working-directory: libraries/react-native-ondevice-ai/example
        run: bun run test -- --runInBand

      - name: Build Android
        working-directory: libraries/react-native-ondevice-ai/example/android
        run: ./gradlew assembleDebug --no-daemon

  build-ios:
    name: Build iOS
    needs: changes
    if: needs.changes.outputs.library == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install library dependencies
        working-directory: libraries/react-native-ondevice-ai
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build library
        working-directory: libraries/react-native-ondevice-ai
        run: npx --no-install bob build

      - name: Register local library
        working-directory: libraries/react-native-ondevice-ai
        run: bun link

      - name: Install example dependencies
        working-directory: libraries/react-native-ondevice-ai/example
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Replace circular library link
        working-directory: libraries/react-native-ondevice-ai/example
        run: |
          unlink node_modules/react-native-ondevice-ai
          rsync -a --exclude='example' --exclude='node_modules' ../ node_modules/react-native-ondevice-ai/

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: libraries/react-native-ondevice-ai/example/ios/Pods
          key: ${{ runner.os }}-pods-rn-${{ hashFiles('libraries/react-native-ondevice-ai/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-rn-

      - name: Install CocoaPods
        working-directory: libraries/react-native-ondevice-ai/example/ios
        run: pod install --no-repo-update

      - name: Build iOS
        working-directory: libraries/react-native-ondevice-ai/example/ios
        run: |
          xcodebuild \
            -workspace OndeviceAiExample.xcworkspace \
            -scheme OndeviceAiExample \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO
