name: Release expo-ondevice-ai

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      create_release:
        description: Create a GitHub release after npm publication
        required: true
        default: true
        type: boolean
      confirm_release:
        description: "Publish the version already committed on main"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-expo-ondevice-ai
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate release inputs
        run: |
          bun run version:check
          VERSION=$(jq -er '.expo' locanara-versions.json)
          TAG_NAME="expo-ondevice-ai-$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/expo-ondevice-ai/$VERSION")
          case "$STATUS" in
            404) ;;
            200)
              echo "npm already contains expo-ondevice-ai@$VERSION"
              exit 1
              ;;
            *)
              echo "Could not verify npm state (HTTP $STATUS)"
              exit 1
              ;;
          esac

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Install library dependencies
        working-directory: libraries/expo-ondevice-ai
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify package
        working-directory: libraries/expo-ondevice-ai
        run: |
          bun run lint:tsc
          bun run lint
          bun run lint:plugin
          bun run test -- --runInBand
          bun run build
          bun run build:plugin

      - name: Setup trusted npm publishing CLI
        run: npm install --global npm@11.19.0

      - name: Publish to npm
        working-directory: libraries/expo-ondevice-ai
        run: npm publish --tag "${{ inputs.tag }}" --access public --provenance

      - name: Create immutable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "expo-ondevice-ai $VERSION"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=()
          if [ "${{ inputs.tag }}" != "latest" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --title "expo-ondevice-ai $VERSION" \
            --notes "Install with: npx expo install expo-ondevice-ai@$VERSION" \
            "${RELEASE_ARGS[@]}"

      - name: Summary
        run: |
          echo "## expo-ondevice-ai Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**npm tag:** ${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
